<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Glossy highlight -->
  <path d="M 4 16 Q 4 4 16 4 L 48 4 Q 60 4 60 16 L 60 28 Q 60 32 56 32 L 8 32 Q 4 32 4 28 Z" fill="url(#gloss)"/>
  <!-- Shinier top highlight line -->
  <rect x="10" y="8" width="18" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
  <!-- White letter A -->
  <text x="32" y="45" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="white" text-anchor="middle">A</text>
</svg>
